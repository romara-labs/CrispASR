# Fails when a tracked file contains a credential (tests/test_no_secrets.py).
# No paths filter on purpose: a token can land in any file, including docs.
# Background: three Kaggle API tokens sat in public tools/kaggle/* scripts from
# 2026-07 to 2026-09 and had to be revoked and scrubbed from history.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: No credentials in tracked files
        env:
          # Only used to assert the account name is NOT in the repo.
          KAGGLE_ACCOUNT: ${{ secrets.KAGGLE_ACCOUNT }}
        run: python3 tests/test_no_secrets.py -v
